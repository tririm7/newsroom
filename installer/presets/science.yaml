  - { pattern: "James Webb",      category: "space" }
  - { pattern: "Hubble",          category: "space" }
  - { pattern: "CRISPR",          category: "biotech" }
  - { pattern: "gene therapy",    category: "biotech" }
  - { pattern: "vaccine",         category: "biotech" }
  - { pattern: "mRNA",            category: "biotech" }
  - { pattern: "cancer",          category: "biotech" }
  - { pattern: "drug",            category: "biotech" }
  - { pattern: "climate",         category: "climate" }
