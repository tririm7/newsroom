name: "Science"
description: "Research, discoveries, space, biotech, climate."

sources:
  - { name: "Nature News",          url: "https://www.nature.com/nature.rss",                 type: "rss", language: "en", tier: 1 }
  - { name: "Science Magazine",     url: "https://www.science.org/rss/news_current.xml",      type: "rss", language: "en", tier: 1 }
  - { name: "MIT Tech Review",      url: "https://www.technologyreview.com/feed/",            type: "rss", language: "en", tier: 2 }
  - { name: "Ars Technica Science", url: "https://arstechnica.com/science/feed/",             type: "rss", language: "en", tier: 2 }
  - { name: "New Scientist",        url: "https://www.newscientist.com/feed/home/",           type: "rss", language: "en", tier: 2 }
  - { name: "Scientific American",  url: "https://www.scientificamerican.com/feed/",          type: "rss", language: "en", tier: 2 }
  - { name: "Quanta Magazine",      url: "https://www.quantamagazine.org/feed/",              type: "rss", language: "en", tier: 2 }
  - { name: "Phys.org",             url: "https://phys.org/rss-feed/",                        type: "rss", language: "en", tier: 3 }
  - { name: "Science News",         url: "https://www.sciencenews.org/feed",                  type: "rss", language: "en", tier: 3 }
  - { name: "ScienceDaily",         url: "https://www.sciencedaily.com/rss/all.xml",          type: "rss", language: "en", tier: 4 }

